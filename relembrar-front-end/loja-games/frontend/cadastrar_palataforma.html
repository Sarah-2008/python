
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Plataforma</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8eaf6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            width: 300px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3949ab;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #283593;
        }
    </style>
</head>
<body>

    <form>
        <h1>Cadastrar Plataforma</h1>

        <label for="nome">Nome da plataforma:</label>
        <input type="text" id="nome" placeholder="Digite o nome da plataforma">

        <button type="button">Cadastrar</button>
    </form>

</body>
</html>
